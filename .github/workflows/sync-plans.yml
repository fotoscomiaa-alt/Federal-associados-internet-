name: Sincronizar planos da Federal

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-plans:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm install
      - name: Sincronizar valores
        run: npm run sync:plans
      - name: Validar build
        run: npm run build
      - name: Registrar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/plans.json
          git diff --cached --quiet || git commit -m "chore: atualizar valores dos planos"
          git push
